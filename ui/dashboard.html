
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLMConnect Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">L</div>
                <div class="brand-copy">
                    <div class="brand-title">LLMConnect</div>
                    <div class="brand-subtitle">Unified LLM hub</div>
                </div>
            </div>

            <div class="search-pill">
                <span class="search-icon" aria-hidden="true"></span>
                <span>Search chats...</span>
            </div>

            <div class="sidebar-scroll">
                <div id="sidebar-nav"></div>
            </div>

            <div class="sidebar-footer">
                <button id="dashboard-settings-btn" class="settings-btn" type="button" data-action="settings">
                    <span class="nav-dot violet" aria-hidden="true"></span>
                    Settings
                </button>
            </div>
        </aside>

        <main class="content">
            <div class="content-scroll">
                <header class="page-header">
                    <div class="page-copy">
                        <div class="eyebrow">Dashboard</div>
                        <h1 class="page-title">Overview</h1>
                        <p class="page-description">A dark-first workspace for browsing saved chats, browser tabs, encrypted API keys, categories, and project-style collections.</p>
                    </div>
                    <div class="header-actions">
                        <button id="dashboard-add-browser-model-btn" class="action-btn" type="button" data-action="add-browser-model">New Tab</button>
                        <button id="dashboard-add-api-key-btn" class="action-btn primary" type="button" data-action="add-api-key">Add Model</button>
                    </div>
                </header>

                <section class="section">
                    <div id="stats-grid" class="stat-grid"></div>
                </section>

                <nav id="tab-strip" class="tab-strip" aria-label="Dashboard sections"></nav>

                <section class="panel" id="main-panel"></section>
            </div>
        </main>
    </div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script>
        let data = __APP_DATA__;
        const tabs = [
            { id: 'llmmodels', label: 'LLM Models' },
            { id: 'rolesnpersona', label: 'Roles & Personas' },
            { id: 'recent', label: 'Recent Activity' },
        ];

        let activeTab = data.defaultTab || 'llmmodels';
        let activeChatId = data.activeChatId || (data.chats[0] && data.chats[0].id) || null;
        let llmConnectBridge = null;

        const node = {
            sidebar: document.getElementById('sidebar-nav'),
            stats: document.getElementById('stats-grid'),
            tabs: document.getElementById('tab-strip'),
            panel: document.getElementById('main-panel'),
            headerTitle: document.querySelector('.page-title'),
            headerDescription: document.querySelector('.page-description'),
        };

        function setDashboardData(nextData) {
            data = nextData;
            if (!data.chats.some((chat) => chat.id === activeChatId)) {
                activeChatId = data.activeChatId || (data.chats[0] && data.chats[0].id) || null;
            }
            if (activeTab === 'categories' && !data.categories.some((category) => category.slug === data.focusedCategory)) {
                data.focusedCategory = data.categories[0] ? data.categories[0].slug : 'uncategorized';
            }
            if (activeTab === 'projects' && !data.projects.some((project) => project.slug === data.focusedProject)) {
                data.focusedProject = data.projects[0] ? data.projects[0].slug : 'uncategorized';
            }
            renderAll();
        }

        window.__LLMCONNECT_RENDER__ = setDashboardData;

        function dispatchAction(action) {
            if (action === 'export') {
                if (llmConnectBridge) {
                    llmConnectBridge.exportDashboard();
                }
                return;
            }

            if (action === 'new-chat') {
                if (llmConnectBridge) {
                    llmConnectBridge.openAddBrowserModel();
                }
                return;
            }

            if (action === 'add-browser-model') {
                if (llmConnectBridge) {
                    llmConnectBridge.openAddBrowserModel();
                }
                return;
            }

            if (action === 'add-api-key') {
                if (llmConnectBridge) {
                    llmConnectBridge.openAddApiKey();
                }
                return;
            }

            if (action === 'settings') {
                if (llmConnectBridge) {
                    llmConnectBridge.openSettings();
                }
                return;
            }

            if (action === 'show-projects') {
                activeTab = 'projects';
                renderAll();
                return;
            }

            if (action === 'show-categories') {
                activeTab = 'categories';
                renderAll();
            }
        }

        document.addEventListener('click', (event) => {
            const button = event.target.closest('button[data-action], button[data-tab], button[data-chat], button[data-category], button[data-project]');
            if (!button) return;

            const { action, tab, chat, category, project } = button.dataset;
            if (action) {
                dispatchAction(action);
                return;
            }
            if (tab) {
                setActiveTab(tab);
                return;
            }
            if (chat) {
                setActiveChat(chat);
                return;
            }
            if (category) {
                data.focusedCategory = category;
                activeTab = 'categories';
                renderAll();
                return;
            }
            if (project) {
                data.focusedProject = project;
                activeTab = 'projects';
                renderAll();
            }
        });

        new QWebChannel(qt.webChannelTransport, (channel) => {
            llmConnectBridge = channel.objects.llmConnectBridge;
        });

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function setActiveTab(tabId) {
            activeTab = tabId;
            renderAll();
        }

        function setActiveChat(chatId) {
            activeChatId = chatId;
            if (activeChatId) {
                activeTab = 'recent';
            }
            renderAll();
        }

        function getActiveChat() {
            return data.chats.find((chat) => chat.id === activeChatId) || data.chats[0] || null;
        }

        function formatDateLabel(isoString) {
            if (!isoString) return 'Unknown';
            const date = new Date(isoString);
            if (Number.isNaN(date.getTime())) return isoString;
            return new Intl.DateTimeFormat(undefined, {
                month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
            }).format(date);
        }

        function shortDateLabel(isoString) {
            if (!isoString) return 'Unknown';
            const date = new Date(isoString);
            if (Number.isNaN(date.getTime())) return isoString;
            return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' }).format(date);
        }

        function renderTabs() {
            node.tabs.innerHTML = tabs.map((tab) => `\n                <button class="tab-btn ${activeTab === tab.id ? 'active' : ''}" type="button" data-tab="${tab.id}">${tab.label}</button>\n            `).join('');

            node.tabs.querySelectorAll('[data-tab]').forEach((button) => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tab));
            });
        }

        function renderStats() {
            node.stats.innerHTML = data.stats.map((stat) => `\n                <article class="stat-card">\n                    <div class="stat-top">\n                        <span class="stat-label">${escapeHtml(stat.label)}</span>\n                        <span class="badge">${escapeHtml(stat.badge)}</span>\n                    </div>\n                    <div class="stat-value">${escapeHtml(stat.value)}</div>\n                    <div class="stat-sublabel">${escapeHtml(stat.sublabel)}</div>\n                </article>\n            `).join('');
        }

        function renderSidebar() {
            const activeChat = getActiveChat();

            node.sidebar.innerHTML = `
                <div class="section-label">Navigation</div>
                <div class="nav-list">
                    <button class="nav-item ${activeTab === 'llmmodels' ? 'active' : ''}" type="button" data-tab="llmmodels">
                        <span class="nav-label"><span class="nav-dot blue" aria-hidden="true"></span>LLM Models</span>
                        <span class="nav-meta">${escapeHtml(String(data.overview.browserModels))} tabs</span>
                    </button>
                </div>

                <div class="section-label">Categories</div>
                <div class="nav-list">
                    ${data.categories.map((category) => `
                        <button class="nav-item ${activeTab === 'categories' && category.slug === data.focusedCategory ? 'active' : ''}" type="button" data-category="${escapeHtml(category.slug)}">
                            <span class="nav-label">
                                <span class="nav-dot ${escapeHtml(category.dot)}" aria-hidden="true"></span>
                                <span>${escapeHtml(category.name)}</span>
                            </span>
                            <span class="nav-meta">${category.count}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="section-label">Projects</div>
                <div class="nav-list">
                    ${data.projects.slice(0, 5).map((project) => `
                        <button class="nav-item ${activeTab === 'projects' && project.slug === data.focusedProject ? 'active' : ''}" type="button" data-project="${escapeHtml(project.slug)}">
                            <span class="nav-label">
                                <span class="nav-dot violet" aria-hidden="true"></span>
                                <span>${escapeHtml(project.name)}</span>
                            </span>
                            <span class="nav-meta">${project.totalChats}</span>
                        </button>
                    `).join('')}
                </div>

                <div class="section-label">Recent Chats</div>
                <div class="nav-list">
                    ${data.chats.slice(0, 4).map((chat) => `
                        <button class="nav-item ${chat.id === activeChatId ? 'active' : ''}" type="button" data-chat="${escapeHtml(chat.id)}">
                            <span class="nav-label">
                                <span class="nav-dot teal" aria-hidden="true"></span>
                                <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px;">${escapeHtml(chat.title)}</span>
                            </span>
                            <span class="nav-meta">${chat.messageCount}</span>
                        </button>
                    `).join('')}
                </div>
            `;

            node.sidebar.querySelectorAll('[data-tab]').forEach((button) => {
                button.addEventListener('click', () => setActiveTab(button.dataset.tab));
            });

            node.sidebar.querySelectorAll('[data-category]').forEach((button) => {
                button.addEventListener('click', () => {
                    data.focusedCategory = button.dataset.category;
                    activeTab = 'categories';
                    renderAll();
                });
            });

            node.sidebar.querySelectorAll('[data-project]').forEach((button) => {
                button.addEventListener('click', () => {
                    data.focusedProject = button.dataset.project;
                    activeTab = 'projects';
                    renderAll();
                });
            });

            node.sidebar.querySelectorAll('[data-chat]').forEach((button) => {
                button.addEventListener('click', () => setActiveChat(button.dataset.chat));
            });
        }

        function renderLlmModels() {
            const browserModelsHtml = data.browserModels.map((model) => `
                <article class="model-card">
                    <div class="model-top">
                        <div class="avatar">${escapeHtml(model.avatar)}</div>
                        <span class="badge"><span class="status-dot ${model.status === 'idle' ? 'idle' : ''}"></span>${escapeHtml(model.statusLabel)}</span>
                    </div>
                    <div class="model-copy">
                        <p class="model-name">${escapeHtml(model.name)}</p>
                        <p class="model-provider">${escapeHtml(model.provider)}</p>
                        ${model.roleName ? `<p class="model-role">Role: ${escapeHtml(model.roleName)}</p>` : ''}
                    </div>
                    <div class="card-footer">
                        <span>${escapeHtml(model.tabName)}</span>
                        <span>${escapeHtml(model.lastUsed)}</span>
                    </div>
                </article>
            `).join('');

            const apiModelsHtml = data.apiModels.map((model) => `
                <article class="model-card">
                    <div class="model-top">
                        <div class="avatar">${escapeHtml(model.avatar)}</div>
                        <span class="badge"><span class="status-dot"></span>${escapeHtml(model.statusLabel)}</span>
                    </div>
                    <div class="model-copy">
                        <p class="model-name">${escapeHtml(model.name)}</p>
                        <p class="model-provider">${escapeHtml(model.model)}${model.type ? ` · ${escapeHtml(model.type)}` : ''}${model.url ? ` · ${escapeHtml(model.url)}` : ''}</p>
                        ${model.roleName ? `<p class="model-role">Role: ${escapeHtml(model.roleName)}</p>` : ''}
                    </div>
                    <div class="card-footer">
                        <span>${escapeHtml(model.maskedKey)}</span>
                        <span>${escapeHtml(model.lastUsed)}</span>
                    </div>
                </article>
            `).join('');

            node.panel.innerHTML = `
                <div>
                    <div style="display:flex;flex-direction:column;gap:16px;">
                        <article class="card">
                            <h2 class="card-title">Connected Browser Models</h2>
                            <div class="card-subtitle">Browser tabs currently mapped to the desktop app</div>
                            <div class="model-grid">${browserModelsHtml}</div>
                        </article>

                        <article class="card">
                            <h2 class="card-title">API Keys</h2>
                            <div class="card-subtitle">Encrypted local API key profiles</div>
                            <div class="model-grid">${apiModelsHtml}</div>
                        </article>

                        <article class="card">
                            <h2 class="card-title">Quick Actions</h2>
                            <div class="card-subtitle">Shortcuts for adding browser models and API keys</div>
                            <div class="quick-actions">
                                <button class="action-btn" type="button" data-action="add-browser-model">Add Browser Model</button>
                                <button class="action-btn" type="button" data-action="add-api-key">Add API Key</button>
                            </div>
                        </article>
                    </div>
                </div>
            `;
        }

        function renderRolesAndPersona() {
            const rolesHtml = data.roles.map((role) => `
                <article class="role-card">
                    <div class="role-top">
                        <span class="role-dot ${escapeHtml(role.accent)}"></span>
                        <div class="role-copy">
                            <p class="role-name">${escapeHtml(role.name)}</p>
                            <p class="role-description">${escapeHtml(role.description)}</p>
                        </div>
                        <span class="badge">${escapeHtml(role.totalChats)} chats</span>
                    </div>
                    <div class="card-footer">
                        <span>${escapeHtml(role.shortPrompt)}</span>
                        <span>Persona</span>
                    </div>
                </article>
            `).join('');

            const apiRoleHtml = data.apiModels.map((model) => `
                <article class="model-card">
                    <div class="model-top">
                        <div class="avatar">${escapeHtml(model.avatar)}</div>
                        <span class="badge"><span class="status-dot"></span>${escapeHtml(model.statusLabel)}</span>
                    </div>
                    <div class="model-copy">
                        <p class="model-name">${escapeHtml(model.name)}</p>
                        <p class="model-provider">${escapeHtml(model.model)}${model.type ? ` · ${escapeHtml(model.type)}` : ''}${model.url ? ` · ${escapeHtml(model.url)}` : ''}</p>
                        ${model.roleName ? `<p class="model-role">Role: ${escapeHtml(model.roleName)}</p>` : ''}
                    </div>
                    <div class="card-footer">
                        <span>${escapeHtml(model.maskedKey)}</span>
                        <span>${escapeHtml(model.lastUsed)}</span>
                    </div>
                </article>
            `).join('');

            node.panel.innerHTML = `
                <div>
                    <div style="display:flex;flex-direction:column;gap:16px;">
                        <article class="card">
                            <h2 class="card-title">Roles Library</h2>
                            <div class="card-subtitle">Preset prompts available when creating tabs and API profiles</div>
                            <div class="role-grid">${rolesHtml}</div>
                        </article>

                        <article class="card">
                            <h2 class="card-title">Saved API Roles</h2>
                            <div class="card-subtitle">API profiles already tagged with a role</div>
                            <div class="model-grid">${apiRoleHtml}</div>
                        </article>
                    </div>

                    <div style="display:flex;flex-direction:column;gap:16px;">
                        <article class="card">
                            <h2 class="card-title">Quick Actions</h2>
                            <div class="card-subtitle">Create or update browser and API roles</div>
                            <div class="quick-actions">
                                <button class="action-btn" type="button" data-action="add-browser-model">Add Browser Model</button>
                                <button class="action-btn" type="button" data-action="add-api-key">Add API Key</button>
                            </div>
                        </article>
                    </div>
                </div>
            `;
        }

        function renderRecent() {
            const activeChat = getActiveChat();

            node.panel.innerHTML = `
                <div class="display:flex;flex-direction:column;gap:16px;">
                    <div class="list-card">
                        ${data.chats.map((chat) => `
                            <div class="chat-row ${chat.id === activeChatId ? 'active' : ''}" data-chat-row="${escapeHtml(chat.id)}">
                                <div class="chat-main">
                                    <p class="chat-title">${escapeHtml(chat.title)}</p>
                                    <div class="chat-meta">${escapeHtml(chat.category)} • ${chat.messageCount} messages</div>
                                    <div class="chat-snippet">${escapeHtml(chat.snippet)}</div>
                                </div>
                                <div class="chat-side">
                                    <div>${escapeHtml(chat.createdLabel)}</div>
                                    <div style="margin-top:6px;">${escapeHtml(chat.createdTime)}</div>
                                </div>
                            </div>
                        `).join('') || '<div class="empty-state">No chats available yet.</div>'}
                    </div>
                </div>
            `;

            node.panel.querySelectorAll('[data-chat-row]').forEach((row) => {
                row.addEventListener('click', () => setActiveChat(row.dataset.chatRow));
            });
        }

        function updateHeader() {
            const copyByTab = {
                llmmodels: {
                    title: 'LLM Models',
                    description: 'Unified hub for browser tabs and encrypted API keys.',
                },
                rolesnpersona: {
                    title: 'Roles & Personas',
                    description: 'Preset prompts and persona templates for tabs and API profiles.',
                },
                recent: {
                    title: 'Recent Activity',
                    description: 'Scan the newest conversations and inspect the currently selected thread.',
                }
            };

            const copy = copyByTab[activeTab] || copyByTab.llmmodels;
            node.headerTitle.textContent = copy.title;
            node.headerDescription.textContent = copy.description;
        }

        function renderAll() {
            updateHeader();
            renderTabs();
            renderSidebar();
            renderStats();

            if (activeTab === 'llmmodels') {
                renderLlmModels();
            } else if (activeTab === 'rolesnpersona') {
                renderRolesAndPersona();
            } else {
                renderRecent();
            }
        }

        renderAll();
    </script>
</body>
</html>
